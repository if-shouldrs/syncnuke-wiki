title: SyncNuke
description: An open standard for synchronized media playback.
url: "https://syncnuke.com"
baseurl: ""
theme: just-the-docs
color_scheme: syncnuke
# Just the Docs 0.12 still uses legacy Sass imports and built-ins.
# Remove these targeted suppressions once the upstream theme migrates.
sass:
  silence_deprecations:
    - import
    - global-builtin
    - color-functions
lang: en
permalink: pretty
search_enabled: true
heading_anchors: true
nav_sort: order
back_to_top: true
back_to_top_text: Back to top
footer_content: "SyncNuke · Specification"
plugins:
  - jekyll-seo-tag
  - jekyll-include-cache
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
  - .agents
  - .codex
  - .aws
defaults:
  - scope:
      path: ""
    values:
      layout: default
